<h2>Your Skill Level 🌟</h2>
<p class="mt-8">
	Are you a coding newbie or a seasoned pro? Don't be shy — share your skill level with us! We've got the perfect content to match your prowess.
</p>

<fieldset (change)="onChange($event)" class="mt-4">
  <legend class="sr-only">Your dev experience</legend>
  <div class="space-y-4">
    <label
			[ngClass]="{
				'border-indigo-600 ring-2 ring-indigo-600': selectedExperience === 'wannabe',
				'border-zinc-800': selectedExperience !== 'wannabe',
			}"
			class="relative block px-6 py-4 transition-all duration-300 border rounded-lg shadow-sm cursor-pointer bg-zinc-900/6 focus:outline-none sm:flex sm:justify-between">
      <input type="radio" name="experience" value="wannabe" class="sr-only" aria-labelledby="experience-wannabe">
      <span class="flex items-center gap-x-2">
        <svg class="w-6 h-6 shrink-0 text-zinc-200" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M10.955 20.2064L9.53351 18.7849C9.12876 18.3801 8.58 18.1534 8.00789 18.1534H6.93957C4.764 18.1534 3 16.3894 3 14.2139V7.29894C3 5.12337 4.764 3.35938 6.93957 3.35938H17.0614C19.237 3.35938 21 5.12337 21 7.29894V14.2139C21 16.3894 19.237 18.1534 17.0614 18.1534H15.9931C15.421 18.1534 14.8722 18.3801 14.4675 18.7849L13.045 20.2064C12.468 20.7834 11.533 20.7834 10.955 20.2064Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M8.85485 8.88672L6.56836 11.1732L8.85485 13.4587" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M15.1445 8.88672L17.431 11.1732L15.1445 13.4587" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M12.8192 8.88672L11.1826 13.4587" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
				<span class="font-medium text-zinc-200" id="experience-wannabe">Wannabe</span>
      </span>
      <span
				[ngClass]="{
					'border-indigo-600': selectedExperience === 'wannabe',
					'border-transparent': selectedExperience !== 'wannabe',
				}"
				class="absolute transition-all duration-300 border-2 rounded-lg pointer-events-none -inset-px"
				aria-hidden="true"
			></span>
    </label>
    <label
			[ngClass]="{
				'border-indigo-600 ring-2 ring-indigo-600': selectedExperience === 'beginner',
				'border-zinc-800': selectedExperience !== 'beginner',
			}"
			class="relative block px-6 py-4 transition-all duration-300 border rounded-lg shadow-sm cursor-pointer bg-zinc-900/6 focus:outline-none sm:flex sm:justify-between">
      <input type="radio" name="experience" value="beginner" class="sr-only" aria-labelledby="experience-beginner">
      <span class="flex items-center gap-x-2">
        <svg class="w-6 h-6 shrink-0 text-zinc-200" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M8.49128 4.53711H15.5133C17.9564 4.53711 19.4694 5.86328 19.4626 8.29961V15.6952C19.4626 18.1315 17.9486 19.4645 15.5055 19.4645H8.49128C6.05592 19.4645 4.53516 18.1082 4.53516 15.6329V8.29961C4.53516 5.86328 6.05592 4.53711 8.49128 4.53711Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M16.0485 4.5373V3M11.9989 4.5373V3M7.94922 4.5373V3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M7.94922 19.4629V21.0002M11.9989 19.4629V21.0002M16.0485 19.4629V21.0002" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M4.5373 7.94922H3M4.5373 11.9989H3M4.5373 16.0485H3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M19.4629 16.0485H21.0002M19.4629 11.9989H21.0002M19.4629 7.94922H21.0002" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path fill-rule="evenodd" clip-rule="evenodd" d="M13.6741 8.44531H10.329C9.16823 8.44531 8.44336 9.07677 8.44336 10.2375V13.7325C8.44336 14.9117 9.16823 15.5578 10.329 15.5578H13.6702C14.8348 15.5578 15.5558 14.9224 15.5558 13.7617V10.2375C15.5597 9.07677 14.8378 8.44531 13.6741 8.44531Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
				<span class="font-medium text-zinc-200" id="experience-beginner">Beginner</span>
      </span>
      <span
				[ngClass]="{
					'border-indigo-600': selectedExperience === 'beginner',
					'border-transparent': selectedExperience !== 'beginner',
				}"
				class="absolute transition-all duration-300 border-2 rounded-lg pointer-events-none -inset-px"
				aria-hidden="true"
			></span>
    </label>
    <label
			[ngClass]="{
				'border-indigo-600 ring-2 ring-indigo-600': selectedExperience === 'intermediate',
				'border-zinc-800': selectedExperience !== 'intermediate',
			}"
			class="relative block px-6 py-4 transition-all duration-300 border rounded-lg shadow-sm cursor-pointer bg-zinc-900/6 focus:outline-none sm:flex sm:justify-between">
      <input type="radio" name="experience" value="intermediate" class="sr-only" aria-labelledby="experience-intermediate">
      <span class="flex items-center gap-x-2">
        <svg class="w-6 h-6 shrink-0 text-zinc-200" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M8.78711 13.4192C8.78711 14.468 9.44286 15.2103 10.4946 15.2103H13.5038C14.5555 15.2103 15.2084 14.468 15.2084 13.4192V10.5841C15.2084 9.53237 14.5555 8.78906 13.5038 8.78906H10.4946C9.44675 8.78906 8.78711 9.53237 8.78711 10.5841V13.4192Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M11.3438 13.2637V15.2105" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M12.8203 8.78906V10.7349" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M5.02148 15.0835C5.02148 17.3614 6.44696 18.9746 8.73162 18.9746H15.2694C17.555 18.9746 18.9727 17.3614 18.9727 15.0835V8.92234C18.9727 6.63768 17.555 5.02344 15.2694 5.02344H8.73162C6.45377 5.02344 5.02148 6.63768 5.02148 8.92234V15.0835Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M9.61328 20.9975V18.9766M14.3872 20.9975V18.9766" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M5.02097 9.61719H3M5.02097 14.3835H3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M9.61328 5.02487V3.00391M14.3872 5.02487V3.00391" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M20.9995 9.61719H18.9707M20.9995 14.3835H18.9707" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
				<span class="font-medium text-zinc-200" id="experience-intermediate">Intermediate</span>
      </span>
      <span
				[ngClass]="{
					'border-indigo-600': selectedExperience === 'intermediate',
					'border-transparent': selectedExperience !== 'intermediate',
				}"
				class="absolute transition-all duration-300 border-2 rounded-lg pointer-events-none -inset-px"
				aria-hidden="true"
			></span>
    </label>
    <label
			[ngClass]="{
				'border-indigo-600 ring-2 ring-indigo-600': selectedExperience === 'experienced',
				'border-zinc-800': selectedExperience !== 'experienced',
			}"
			class="relative block px-6 py-4 transition-all duration-300 border rounded-lg shadow-sm cursor-pointer bg-zinc-900/6 focus:outline-none sm:flex sm:justify-between">
      <input type="radio" name="experience" value="experienced" class="sr-only" aria-labelledby="experience-experienced">
      <span class="flex items-center gap-x-2">
        <svg class="w-6 h-6 shrink-0 text-zinc-200" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M11.988 14.9463L13.6995 11.999H10.2969L12.0065 9.05078" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M5.02148 15.0835C5.02148 17.3614 6.44696 18.9746 8.73162 18.9746H15.2694C17.555 18.9746 18.9727 17.3614 18.9727 15.0835V8.92234C18.9727 6.63768 17.555 5.02344 15.2694 5.02344H8.73162C6.45377 5.02344 5.02148 6.63768 5.02148 8.92234V15.0835Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M9.61328 20.9975V18.9766M14.3872 20.9975V18.9766" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M5.02097 9.61719H3M5.02097 14.3835H3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M9.61328 5.02487V3.00391M14.3872 5.02487V3.00391" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M20.9995 9.61719H18.9707M20.9995 14.3835H18.9707" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
				<span class="font-medium text-zinc-200" id="experience-experienced">Experienced</span>
      </span>
      <span
				[ngClass]="{
					'border-indigo-600': selectedExperience === 'experienced',
					'border-transparent': selectedExperience !== 'experienced',
				}"
				class="absolute transition-all duration-300 border-2 rounded-lg pointer-events-none -inset-px"
				aria-hidden="true"
			></span>
    </label>
		

  </div>
</fieldset>


<button
	[disabled]="!selectedExperience || loading"
	(click)="submit()"
	class="rounded-md disabled:opacity-40 ml-auto disabled:cursor-not-allowed px-3.5 py-2.5 mt-6 flex items-center justify-center space-x-2 text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 disabled:hover:bg-indigo-600 ring-indigo-400 hover:ring-indigo-400 focus-visible:outline-indigo-600 text-white shadow-sm hover:ring-2 disabled:ring-0 disabled:ring-offset-0 hover:ring-offset-1 ring-offset-zinc-950 transition-all duration-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2"
>
	<svg [ngClass]="{ '-ml-8 opacity-0': !loading, '-ml-0 opacity-100': loading }" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid" class="w-4 h-4 mr-2 transition-all duration-300 pointer-events-none shrink-0 animate-spin" style="shape-rendering: auto;">
		<circle cx="50" cy="50" fill="none" stroke-width="7" r="42" stroke-dasharray="197.92033717615698 67.97344572538566" class="stroke-white">
		</circle>
	</svg>

	<span>Continue</span>
	
	<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
		<g id="Iconly/Light/Arrow---Right" stroke="currentColor" stroke-width="1.5" fill="none" fill-rule="evenodd" stroke-linecap="round" stroke-linejoin="round">
			<g id="Arrow---Right" transform="translate(12.000000, 12.000000) rotate(-90.000000) translate(-12.000000, -12.000000) translate(5.500000, 4.000000)" stroke="currentColor" stroke-width="1.5" >
				<line x1="6.7743" y1="15.75" x2="6.7743" y2="0.75" id="Stroke-1"></line>
				<polyline id="Stroke-3" points="12.7987 9.7002 6.7747 15.7502 0.7497 9.7002"></polyline>
			</g>
		</g>
	</svg>
</button>
