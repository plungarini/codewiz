<div
	[ngClass]="{
		'-translate-y-2 opacity-0': !show,
		'-translate-y-0 opacity-100': show,
	}"
	class="flex flex-row items-center justify-between w-full mt-2 space-x-2 transition-all duration-500"
>
	<!-- Discover articles -->
	<ng-container *ngIf="msg.pageSections as sections">
		<button
			*ngIf="sections.length > 0"
			[disabled]="sections.length <= 0"
			(click)="showPageSections()"
			class="inline-flex flex-row items-center space-x-2 transition-all duration-300 opacity-100 cursor-pointer shrink-0 grow-0 disabled:opacity-0 disabled:cursor-default disabled:pointer-events-none text-zinc-600 hover:text-zinc-200"
		>
			<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M13.7855 3.00003C14.344 3.00003 14.8782 3.2277 15.2644 3.63051L19.0561 7.5798C19.422 7.96121 19.6273 8.47007 19.6273 8.99937V17.1645C19.6418 19.2195 18.0238 20.9163 15.9699 21C15.9699 21 8.07419 21 8.04403 20.999C5.9716 20.9533 4.32825 19.237 4.37398 17.1645V6.65743C4.42263 4.61808 6.09419 2.99224 8.13451 3.00003H13.7855Z" stroke="currentColor"  stroke-width="1.5"  stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M14.2686 3.0625V5.95514C14.2676 7.36693 15.4108 8.51211 16.8226 8.51601H19.5615" stroke="currentColor"  stroke-width="1.5"  stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M12.9628 12.2383L15.1004 14.3759L12.9297 16.5456" stroke="currentColor"  stroke-width="1.5"  stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M10.6288 10.2266L8.49121 12.3642L10.6619 14.5339" stroke="currentColor"  stroke-width="1.5"  stroke-linecap="round" stroke-linejoin="round"/>
			</svg>
	
			<ng-container *ngIf="msg.content as content">
				<ng-container *ngIf="sections.length as sectionsLen">
					<p
						*ngIf="content.length > 20"
						class="-mt-[0.08rem] text-xs font-medium tracking-wide text-zinc-600"
					>
						{{ sectionsLen }} page{{ sectionsLen > 1 ? 's' : ''}}
					</p>
				</ng-container>
			</ng-container>		
		</button>
	</ng-container>
	

	<!-- Placeholder for space -->
	<div *ngIf="!msg.pageSections || msg.pageSections.length <= 0"></div>

	<ng-container>
		<div *ngIf="msg.content.length > 5" class="flex flex-row space-x-2 shrink-0 grow-0">
			<!-- Like Button -->
			<button class="transition-all duration-300 cursor-pointer text-zinc-600 hover:text-zinc-200">
				<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

					<path d="M8.01367 9.97907C9.38652 9.97907 11.4694 8.53086 12.2801 4.88532C12.384 4.41795 12.4967 3.95583 12.9924 3.76833C13.3334 3.63935 13.781 3.70626 14.1307 3.77815C15.4653 4.05249 16.4955 5.71985 14.983 10.0793" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
			</button>
		
			<!-- Dislike Button -->
			<button class="transition-all duration-300 cursor-pointer text-zinc-600 hover:text-zinc-200">
				<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M18.856 15.2266H19.0867C19.7493 15.2266 20.0806 15.2266 20.3345 15.0997C20.5676 14.9832 20.7566 14.7942 20.8731 14.5611C21 14.3071 21 13.9758 21 13.3132V5.60784C21 4.94526 21 4.61397 20.8731 4.36C20.7566 4.1269 20.5676 3.9379 20.3345 3.82143C20.0806 3.69453 19.7493 3.69453 19.0867 3.69453H19.0867H18.856H18.856C17.8622 3.69453 17.3652 3.69453 16.9843 3.88488C16.6346 4.05959 16.3511 4.34308 16.1764 4.69274C15.9861 5.07369 15.9861 5.57063 15.9861 6.5645V12.3566C15.9861 13.3505 15.9861 13.8474 16.1764 14.2284C16.3511 14.578 16.6346 14.8615 16.9843 15.0362C17.3652 15.2266 17.8622 15.2266 18.856 15.2266Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

					<path d="M15.9863 14.0209C14.6135 14.0209 12.5306 15.4691 11.7199 19.1147C11.616 19.582 11.5033 20.0442 11.0076 20.2317C10.6666 20.3607 10.219 20.2937 9.86934 20.2219C8.53469 19.9475 7.50449 18.2802 9.01697 13.9207" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
			</button>
		</div>
	</ng-container>
</div>
