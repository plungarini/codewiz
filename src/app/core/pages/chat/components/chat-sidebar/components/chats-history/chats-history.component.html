<div class="flex flex-col space-y-2">
	<a
		*ngFor="let chat of chatHistory"
		routerLink="/app/chat/{{chat.repo}}/{{chat.id}}"
		routerLinkActive
		#rla="routerLinkActive"
		[routerLinkActiveOptions]="{
			exact: true,
		}"
		[title]="chat.name"
		[ngClass]="{
			'bg-zinc-800/80 text-zinc-200': rla.isActive,
			'bg-transparent hover:bg-zinc-900/80 text-zinc-400': !rla.isActive,
		}"
		class="block w-full px-4 py-2 text-sm truncate transition-all duration-300 rounded-md"
	>
		{{ chat.name || 'New chat' }}
	</a>
</div>
