<div
	[ngClass]="{
		'-translate-y-2 opacity-0': !show,
		'-translate-y-0 opacity-100': show,
	}"
	class="flex flex-row items-center justify-between w-full mt-2 space-x-2 transition-all duration-500"
>
	<!-- Discover articles -->
	<ng-container *ngIf="msg.pageSections as sections">
		<button
			*ngIf="sections.length > 0 && containerWidth > 90"
			[disabled]="sections.length <= 0 && containerWidth > 90"
			(click)="showPageSections()"
			class="inline-flex flex-row items-center space-x-2 transition-all duration-300 opacity-100 cursor-pointer shrink-0 grow-0 disabled:opacity-0 disabled:cursor-default disabled:pointer-events-none text-zinc-600 hover:text-zinc-200"
		>
			<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M13.7855 3.00003C14.344 3.00003 14.8782 3.2277 15.2644 3.63051L19.0561 7.5798C19.422 7.96121 19.6273 8.47007 19.6273 8.99937V17.1645C19.6418 19.2195 18.0238 20.9163 15.9699 21C15.9699 21 8.07419 21 8.04403 20.999C5.9716 20.9533 4.32825 19.237 4.37398 17.1645V6.65743C4.42263 4.61808 6.09419 2.99224 8.13451 3.00003H13.7855Z" stroke="currentColor"  stroke-width="1.5"  stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M14.2686 3.0625V5.95514C14.2676 7.36693 15.4108 8.51211 16.8226 8.51601H19.5615" stroke="currentColor"  stroke-width="1.5"  stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M12.9628 12.2383L15.1004 14.3759L12.9297 16.5456" stroke="currentColor"  stroke-width="1.5"  stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M10.6288 10.2266L8.49121 12.3642L10.6619 14.5339" stroke="currentColor"  stroke-width="1.5"  stroke-linecap="round" stroke-linejoin="round"/>
			</svg>
	
			<ng-container *ngIf="sections.length as sectionsLen">
				<p
					*ngIf="containerWidth > 145"
					class="-mt-[0.08rem] text-xs font-medium tracking-wide text-zinc-600"
				>
					{{ sectionsLen }} page{{ sectionsLen > 1 ? 's' : ''}}
				</p>
			</ng-container>
		</button>
	</ng-container>
	

	<!-- Placeholder for space -->
	<div *ngIf="!msg.pageSections || msg.pageSections.length <= 0"></div>
