<div class="relative">
	<app-status
		class="pointer-events-none"
		[status]="status"
	></app-status>

	<div
		class="h-screen max-h-screen pt-6 overflow-x-hidden overflow-y-auto"
		#mainChatContainer
	>
		<app-messages
			[chat]="chat"
		></app-messages>
	</div>
	
	<app-query-input
		(onQuery)="createQuery($event)"
	></app-query-input>
</div>
