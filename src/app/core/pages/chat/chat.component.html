<div class="relative flex flex-col justify-between h-full rounded-2xl bg-zinc-900">
	<app-status
		[status]="status"
	></app-status>

	<app-messages
		[chat]="chat"
	></app-messages>

	<div class="absolute left-0 w-full bottom-[5.5rem] pr-4">
		<div class="pt-16 bg-gradient-to-b from-transparent to-zinc-900"></div>
	</div>
	
	<app-query-input
		class="w-full max-w-3xl mx-auto mb-4"
		(onQuery)="createQuery($event)"
	></app-query-input>
</div>
