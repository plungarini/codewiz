<div class="relative z-10 flex flex-row items-center justify-between w-full pb-2 mb-4 border-b border-zinc-800 bg-zinc-950">
	<h3 class="mb-0">Repo details</h3>

	<button *ngIf="form.value.id" routerLink="/app/admin/repos/edit/{{form.value.id}}/edit-pages" class="px-2 py-1 text-sm leading-6 rounded-md cursor-pointer bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-zinc-50">Edit embeddings</button>
</div>


<form
	[formGroup]="form"
	class="relative z-0 flex flex-col pb-6 mb-4 space-y-4 transition-all duration-300 border-b border-zinc-800"
>
	<div class="flex flex-col items-center space-y-4 sm:flex-row sm:space-y-0 sm:space-x-4">
		
		<div class="flex-1 w-full">
			<label for="id"><p class="mb-1 text-sm">Slug</p></label>
			<input
				type="text"
				formControlName="id"
				id="id"
				name="id"
				placeholder="Slug"
				class="w-full px-3 py-1 transition-all duration-300 border rounded-md outline-none bg-zinc-900 border-zinc-600 text-zinc-200 focus:outline-none outline-offset-0 focus:border-zinc-600 focus:ring-1 focus:ring-offset-1 focus:ring-purple-400 focus:ring-offset-zinc-950"
			>
		</div>

		<div class="flex-1 w-full">
			<label for="name"><p class="mb-1 text-sm">Name</p></label>
			<input
				type="text"
				formControlName="name"
				id="name"
				name="name"
				placeholder="Name"
				class="w-full px-3 py-1 transition-all duration-300 border rounded-md outline-none bg-zinc-900 border-zinc-600 text-zinc-200 focus:outline-none outline-offset-0 focus:border-zinc-600 focus:ring-1 focus:ring-offset-1 focus:ring-purple-400 focus:ring-offset-zinc-950"
			>
		</div>

	</div>

	<div class="flex flex-col items-center space-y-4 sm:flex-row sm:space-y-0 sm:space-x-4">
		
		<div class="flex-1 w-full">
			<label for="logo"><p class="mb-1 text-sm">Logo</p></label>
			<input
				type="text"
				formControlName="logo"
				id="logo"
				name="logo"
				placeholder="Logo"
				class="w-full px-3 py-1 transition-all duration-300 border rounded-md outline-none bg-zinc-900 border-zinc-600 text-zinc-200 focus:outline-none outline-offset-0 focus:border-zinc-600 focus:ring-1 focus:ring-offset-1 focus:ring-purple-400 focus:ring-offset-zinc-950"
			>
		</div>

		<div class="flex-1 w-full">
			<label for="url"><p class="mb-1 text-sm">Docs URL</p></label>
			<input
				type="text"
				formControlName="url"
				id="url"
				name="url"
				placeholder="Docs url"
				class="w-full px-3 py-1 transition-all duration-300 border rounded-md outline-none bg-zinc-900 border-zinc-600 text-zinc-200 focus:outline-none outline-offset-0 focus:border-zinc-600 focus:ring-1 focus:ring-offset-1 focus:ring-purple-400 focus:ring-offset-zinc-950"
			>
		</div>

	</div>

	<div class="flex flex-col items-center space-y-4 sm:flex-row sm:space-y-0 sm:space-x-4">
		
		<div class="flex-1 w-full">
			<label for="hostUrl"><p class="mb-1 text-sm">Host URL</p></label>
			<input
				type="text"
				formControlName="hostUrl"
				id="hostUrl"
				name="hostUrl"
				placeholder="Host URL"
				class="w-full px-3 py-1 transition-all duration-300 border rounded-md outline-none bg-zinc-900 border-zinc-600 text-zinc-200 focus:outline-none outline-offset-0 focus:border-zinc-600 focus:ring-1 focus:ring-offset-1 focus:ring-purple-400 focus:ring-offset-zinc-950"
			>
		</div>

		<div class="flex-1 w-full">
			<label for="replaceUrl"><p class="mb-1 text-sm">Replace URL</p></label>
			<input
				type="text"
				formControlName="replaceUrl"
				id="replaceUrl"
				name="replaceUrl"
				placeholder="Replace URL"
				class="w-full px-3 py-1 transition-all duration-300 border rounded-md outline-none bg-zinc-900 border-zinc-600 text-zinc-200 focus:outline-none outline-offset-0 focus:border-zinc-600 focus:ring-1 focus:ring-offset-1 focus:ring-purple-400 focus:ring-offset-zinc-950"
			>
		</div>

	</div>

	<button
		type="submit"
		[disabled]="loadingSave"
		(click)="save()"
		class="px-3 py-1.5 font-medium transition-all duration-300 bg-teal-500 rounded-md shadow-xl w-fit disabled:cursor-not-allowed disabled:opacity-50 text-zinc-900 hover:bg-teal-400 hover:shadow-2xl"
	>
		Save
	</button>
</form>
