<div class="flex items-center justify-between mb-4 sm:pt-12">
	<h2 class="mb-0">Repos list</h2>

	<div routerLink="/app/admin/repos/edit/new" class="transition-colors duration-300 cursor-pointer text-zinc-400 hover:text-zinc-50">
		<svg class="w-6 h-6" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
			<g id="Iconly/Light/Plus" stroke="currentColor" stroke-width="1.5" fill="none" fill-rule="evenodd" stroke-linecap="round" stroke-linejoin="round">
				<g id="Plus" transform="translate(2.000000, 2.000000)" stroke="currentColor" stroke-width="1.5" >
					<line x1="10" y1="6.32730733" x2="10" y2="13.6536632" id="Line_185"></line>
					<line x1="13.6666667" y1="9.99048525" x2="6.33333333" y2="9.99048525" id="Line_186"></line>
					<path d="M14.6857143,0 L5.31428571,0 C2.04761905,0 0,2.31208373 0,5.58515699 L0,14.414843 C0,17.6879163 2.03809524,20 5.31428571,20 L14.6857143,20 C17.9619048,20 20,17.6879163 20,14.414843 L20,5.58515699 C20,2.31208373 17.9619048,0 14.6857143,0 Z" id="Path"></path>
				</g>
			</g>
		</svg>
	</div>
</div>

<ng-container *ngIf="repos | async as repos">
	<div *ngIf="repos.length > 0; else noRepos" class="flex flex-col mt-4 overflow-hidden border divide-y rounded-md divide-zinc-800 border-zinc-800">

		<a
			*ngFor="let repo of repos"
			routerLink="/app/admin/repos/edit/{{repo.id}}"
			class="flex flex-row items-center justify-between max-w-full px-3 py-2 space-x-4 transition-all duration-300 bg-transparent cursor-pointer group hover:bg-zinc-900"
		>
			<div class="flex flex-row items-center space-x-4">
				<img
					ixImg
					[alt]="repo.name"
					priority
					loading="eager"
					priority
					[width]="1"
					[height]="1"
					[path]="repo.logo"
					class="w-5 h-5 shrink-0"
				>
				<p class="font-medium text-zinc-300">{{repo.name}}</p>
			</div>
			<div class="flex flex-row items-center space-x-4">
				<span class="truncate text-zinc-500">{{repo.updatedAt?.toDate() | date:'mediumDate'}}</span>

				<div class="relative">
					<div
						[ngClass]="{
							'opacity-0': !repo.hide,
							'bg-amber-300 animate-ping opacity-100': repo.hide,
						}"
						class="absolute top-0 left-0 z-10 w-3 h-3 transition-all duration-300 rounded-full"
					></div>
					<div
						[ngClass]="{
							'bg-teal-500': !repo.hide,
							'bg-amber-400': repo.hide,
						}"
						class="relative z-20 w-3 h-3 rounded-full"
					></div>
				</div>

			</div>
		</a>
	</div>

	<ng-template #noRepos>
		<p class="mt-4">No supported docs to show...</p>
	</ng-template>
</ng-container>
