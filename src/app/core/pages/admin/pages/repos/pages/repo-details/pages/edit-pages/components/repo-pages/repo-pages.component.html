<ng-container *ngIf="pages$ | async as pages">
	<div *ngIf="pages.length > 0" tabindex="1" class="flex flex-col overflow-hidden border divide-y rounded-md divide-zinc-800 border-zinc-800">
		<a
			*ngFor="let page of pages; let i = index"
			class="flex justify-between max-w-full px-3 py-2 transition-all duration-300 bg-transparent gap-x-4 pages-center group hover:bg-zinc-900"
		>
			<div (click)="isEditMode[i] ? null : previewContentClick(page.content)" class="flex items-center cursor-pointer gap-x-4">
				<p *ngIf="!isEditMode[i]" class="font-medium truncate text-zinc-300">{{page.title}}</p>
				<input type="text" [formControl]="input" *ngIf="isEditMode[i]" autofocus="true" class="px-0 py-0 bg-transparent border-0 border-transparent outline-none text-zinc-400 focus:outline-none focus:ring-0 ring-0 focus:border-0">
				<p class="text-sm font-medium text-zinc-500">{{page.name}}</p>
			</div>

			<div class="flex items-center gap-x-4">
				<p
					*ngIf="page.status"
					[ngClass]="{
						'text-teal-400': page.status === 'success',
						'text-red-400': page.status === 'failed',
						'text-amber-400': page.status === 'loading',
					}"
					class="pt-0 mt-0 text-sm"
				>
					{{page.status}}
				</p>

				<div class="flex items-center gap-x-2" *ngIf="page.status !== 'success' && page.status !== 'loading'">
					<svg *ngIf="!isEditMode[i]" (click)="showEditTitle(page, i)" class="w-5 h-5 transition-colors duration-300 cursor-pointer text-zinc-500 hover:text-zinc-50" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
						<g stroke="currentColor" stroke-width="1.5" fill="none" fill-rule="evenodd" stroke-linecap="round" stroke-linejoin="round">
							<g id="Edit" transform="translate(3.000000, 3.000000)" stroke="currentColor" stroke-width="1.5" >
								<line x1="10.7473996" y1="17.4429051" x2="18" y2="17.4429051" id="Stroke-1"></line>
								<path d="M9.7800071,0.794792587 C10.5556498,-0.132213323 11.949987,-0.268144478 12.8962256,0.491732963 C12.9485416,0.532957985 14.6294799,1.83878843 14.6294799,1.83878843 C15.6689776,2.46719147 15.9919725,3.80310504 15.3493946,4.8225887 C15.3152754,4.877184 5.81194644,16.7644749 5.81194644,16.7644749 C5.49577537,17.1588981 5.01583223,17.3917638 4.50290722,17.3973347 L0.863527997,17.4430165 L0.0435303654,13.9723153 C-0.0713375414,13.4843002 0.0435303654,12.9717729 0.359701436,12.5773497 L9.7800071,0.794792587 Z" id="Stroke-3"></path>
								<line x1="8.02082217" y1="3.00088838" x2="13.4730672" y2="7.18801364" id="Stroke-5"></line>
							</g>
						</g>
					</svg>
					
					<svg *ngIf="!isEditMode[i]" (click)="manualElaborateClick(page)" class="w-5 h-5 transition-colors duration-300 cursor-pointer text-zinc-500 hover:text-zinc-50" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M18.5637 17.36C19.9998 16.711 21 15.2651 21 13.5858C21 10.9899 19.1698 9.44677 16.897 9.44579C16.897 7.81314 15.6165 4.54688 12 4.54688C8.38346 4.54688 7.10303 7.81314 7.10303 9.44579C4.83308 9.46525 3 10.9899 3 13.5858C3 15.2651 3.99924 16.711 5.43632 17.36" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
						<path d="M9.22852 15.2281L11.9995 12.457L14.7706 15.2281" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
						<path d="M12 12.457L12.0006 19.4512" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>

					<svg *ngIf="isEditMode[i]" (click)="editPage(page)" class="w-5 h-5 transition-colors duration-300 cursor-pointer text-zinc-500 hover:text-zinc-50" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M19 7.1875L9.375 16.8125L5 12.4375" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>

					<svg (click)="!isEditMode[i] ? deletePage(page) : cancelEdit()" class="w-5 h-5 transition-colors duration-300 cursor-pointer text-zinc-500 hover:text-zinc-50" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M6 6L18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
						<path d="M18 6L6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</div>
			</div>
		</a>
	</div>
</ng-container>
