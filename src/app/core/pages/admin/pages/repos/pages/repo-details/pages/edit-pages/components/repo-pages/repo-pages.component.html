<ng-container *ngIf="pages$ | async as pages">
	<div *ngIf="pages.length > 0" class="flex flex-col overflow-hidden border divide-y rounded-md divide-zinc-800 border-zinc-800">
		<a
			*ngFor="let page of pages"
			class="flex flex-row justify-between max-w-full px-3 py-2 space-x-4 transition-all duration-300 bg-transparent cursor-pointer pages-center group hover:bg-zinc-900"
		>
			<div class="flex flex-row items-center space-x-4">
				<p class="font-medium truncate text-zinc-300">{{page.title}}</p>
				<p class="text-sm font-medium text-zinc-500">{{page.name}}</p>
			</div>
			<div class="flex flex-row items-center space-x-4">
				<p
						*ngIf="page.status"
						[ngClass]="{
							'text-teal-400': page.status === 'success',
							'text-red-400': page.status === 'failed',
							'text-amber-400': page.status === 'loading',
						}"
						class="pt-0 mt-0 text-sm"
					>
						{{page.status}}
					</p>
			</div>
		</a>
	</div>
</ng-container>
