<div *ngIf="user" class="flex items-start justify-between space-x-4">
	<div class="flex items-center space-x-4">
		<img
			ixImg
			[path]="user.details?.imgUrl || 'assets/404_pip_image.png'"
			[alt]="user.name || 'Anonymous'"
			[width]="1"
			[height]="1"
			class="block object-cover object-center w-12 h-12 rounded-md shrink-0"
		>

		<div class="flex-1 -mt-1 overflow-hidden">
			<p class="text-lg font-medium text-white truncate">{{user.name || 'Anonymous'}}</p>
			<p class="text-base font-medium truncate text-zinc-500">{{user.email || 'no@email.com'}}</p>
		</div>
	</div>

	<div class="flex items-center space-x-2">
		<a href="{{firebaseBaseUrl}}{{user.id}}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center w-8 h-8 transition-colors duration-300 bg-indigo-500 rounded-md cursor-pointer hover:bg-indigo-400">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" class="w-5 h-5 shrink-0">
				<path d="M19.62 11.558l-3.203 2.98-2.972-5.995 1.538-3.448c.4-.7 1.024-.692 1.414 0z" fill="#ffa000"/>
				<path d="M13.445 8.543l2.972 5.995-11.97 11.135z" fill="#f57f17"/>
				<path d="M23.123 7.003c.572-.55 1.164-.362 1.315.417l3.116 18.105-10.328 6.2c-.36.2-1.32.286-1.32.286s-.874-.104-1.207-.3L4.447 25.673z" fill="#ffca28"/>
				<path d="M13.445 8.543l-8.997 17.13L8.455.638c.148-.78.592-.855.988-.167z" fill="#ffa000"/>
			</svg>
		</a>
		<a href="{{stripeBaseUrl}}{{user.stripeId}}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center w-8 h-8 transition-colors duration-300 bg-indigo-500 rounded-md cursor-pointer hover:bg-indigo-400">
			<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="w-4 h-4 text-white shrink-0" viewBox="0 0 24 24" role="img">
				<path d="M13.976 9.15c-2.172-.806-3.356-1.426-3.356-2.409 0-.831.683-1.305 1.901-1.305 2.227 0 4.515.858 6.09 1.631l.89-5.494C18.252.975 15.697 0 12.165 0 9.667 0 7.589.654 6.104 1.872 4.56 3.147 3.757 4.992 3.757 7.218c0 4.039 2.467 5.76 6.476 7.219 2.585.92 3.445 1.574 3.445 2.583 0 .98-.84 1.545-2.354 1.545-1.875 0-4.965-.921-6.99-2.109l-.9 5.555C5.175 22.99 8.385 24 11.714 24c2.641 0 4.843-.624 6.328-1.813 1.664-1.305 2.525-3.236 2.525-5.732 0-4.128-2.524-5.851-6.594-7.305h.003z"/>
			</svg>
		</a>
	</div>
</div>
