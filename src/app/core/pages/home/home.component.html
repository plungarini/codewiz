<div class="w-full h-full max-h-full py-6 pb-16 overflow-hidden overflow-y-auto">
	<app-banner
		[name]="getName((user$ | async)?.displayName)"
	></app-banner>

	<div class="flex flex-col w-full max-h-full px-6 py-6 space-y-6">
		<app-profile-overview class="w-full max-w-2xl mx-auto"></app-profile-overview>

		<div class="grid w-full max-w-2xl grid-cols-1 mx-auto space-y-4 md:space-y-0 md:grid-cols-2">
			<div>
				<h3 class="text-base font-semibold leading-6 text-zinc-500">Latest chats</h3>
				<app-latest-chats></app-latest-chats>
			</div>
			<div>
				<h3 class="text-base font-semibold leading-6 text-zinc-500">Community ideas</h3>
				<app-ideas></app-ideas>
			</div>
		</div>
	</div>
</div>
