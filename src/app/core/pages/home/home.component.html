<div class="w-full h-full max-h-full py-6 overflow-hidden">
	<div class="w-full px-6 mt-24">
		<div class="relative max-w-3xl px-8 py-12 mx-auto rounded-md shadow-2xl bg-gradient-to-br from-indigo-950/40 via-purple-950/10 to-pink-600/10">
			<h2 class="mb-0">Welcome back<span *ngIf="getName((user$ | async)?.displayName) as name">,<br>{{name}}</span></h2>
			<img
				ixImg
				alt="CodeWhiz Robot"
				priority
				loading="eager"
				priority
				[width]="1"
				[height]="1"
				path="assets/robot-codewhiz-ai.png"
				class="absolute bottom-0 w-56 h-56 shrink-0 right-4"
			>
		</div>
	</div>

	<div class="flex flex-col w-full max-h-full px-6 py-6 mt-6 space-y-6 overflow-x-hidden overflow-y-auto">
		<app-profile-overview class="w-full max-w-3xl mx-auto"></app-profile-overview>
	</div>
</div>
