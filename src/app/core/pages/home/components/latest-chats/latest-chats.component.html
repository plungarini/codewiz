<div class="h-full overflow-hidden overflow-y-auto rounded-lg shadow bg-zinc-900 max-h-72 md:rounded-r-none md:border-r border-zinc-800">
	<div class="flex flex-col py-1 divide-y divide-zinc-800">
		<ng-container *ngFor="let chat of (chats$ | async); trackBy: trackBy">
			<div [routerLink]="['/app/chat/', chat.repo.id, chat.id]" class="flex items-center py-1.5 px-2.5 bg-zinc-900 hover:bg-zinc-800 space-x-2 cursor-pointer">
				<img
					ixImg
					[alt]="chat.repo"
					priority
					loading="eager"
					priority
					[width]="1"
					[height]="1"
					[path]="chat.repo.logo"
					class="w-5 h-5 shrink-0"
				>
				<p class="text-base truncate">{{chat.name}}</p>
				<div class="flex-1"></div>
				<p class="text-xs text-zinc-600 shrink-0">{{getTimeDifference(chat.updatedAt?.toDate())}}</p>
			</div>
		</ng-container>
	</div>
</div>
