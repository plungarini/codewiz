<div *ngIf="title">
	<nav class="sm:hidden" aria-label="Back">
		<a routerLink="/app/lern" class="flex items-center text-sm font-medium text-zinc-400 hover:text-zinc-200">
			<svg class="flex-shrink-0 w-5 h-5 mr-1 -ml-1 text-zinc-500" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
				<path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd" />
			</svg>
			Back
		</a>
	</nav>
    
	<nav class="hidden max-w-full sm:flex" aria-label="Breadcrumb">
		<ol role="list" class="flex items-center max-w-full gap-x-4">
			<li>
				<div class="flex">
					<a routerLink="/app/lern" class="text-sm font-medium transition-colors duration-300 text-zinc-400 hover:text-zinc-200">Lern</a>
				</div>
			</li>
			<li class="max-w-full pr-11">
				<div class="flex items-center max-w-full">
					<svg class="flex-shrink-0 w-5 h-5 text-zinc-500" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
						<path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
					</svg>
					<a aria-current="page" class="ml-4 text-sm font-medium truncate text-zinc-400">{{title}}</a>
				</div>
			</li>
		</ol>
	</nav>
</div>
